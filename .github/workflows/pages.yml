name: Demo (GitHub Pages)

# Publishes the static client to the gh-pages branch (classic Pages
# source) as a server-less demo: landing + solo practice pages, where
# speech scoring fully works client-side. Rooms need the real Render
# deployment; this is the shareable taste.
on:
  push:
    branches: [main]
    paths: [serifu/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: serifu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: serifu/package-lock.json
      - run: npm ci
      - name: Build for the Pages subpath
        run: VITE_BASE=/verbose-octo-carnival/ npm run build
      - name: Push to gh-pages
        run: |
          touch dist/.nojekyll
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy: Serifu demo site ($GITHUB_SHA)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
