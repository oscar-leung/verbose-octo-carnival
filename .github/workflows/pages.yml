name: Demo (GitHub Pages)

# Publishes the static client as a server-less demo: landing + the solo
# practice pages (speech scoring works — it's all client-side). Rooms need
# the real Render deployment; this is the shareable taste.
on:
  push:
    branches: [main, claude/anime-japanese-learning-app-8t26D]
    paths: [serifu/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: serifu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: serifu/package-lock.json
      - run: npm ci
      - name: Build for the Pages subpath
        run: VITE_BASE=/verbose-octo-carnival/ npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: serifu/dist
      - id: deployment
        uses: actions/deploy-pages@v4
