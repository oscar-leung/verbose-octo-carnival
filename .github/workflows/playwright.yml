name: Playwright E2E

on:
  push:
    branches: [main]
    paths:
      - 'playwright-portfolio/**'
      - '.github/workflows/playwright.yml'
  pull_request:
    paths:
      - 'playwright-portfolio/**'
      - '.github/workflows/playwright.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: playwright-portfolio

jobs:
  test:
    name: Test on ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, api]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: playwright-portfolio/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Install Playwright browsers
        if: matrix.project != 'api'
        run: npx playwright install --with-deps ${{ matrix.project == 'webkit' && 'webkit' || matrix.project }}

      - name: Run tests
        run: npx playwright test --project=${{ matrix.project }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-portfolio/playwright-report/
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-${{ matrix.project }}
          path: playwright-portfolio/test-results/
          retention-days: 7
