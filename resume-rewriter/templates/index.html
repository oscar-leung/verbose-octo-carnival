<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Resume Bullet Rewriter</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-50 text-stone-900 antialiased">
  <main class="mx-auto max-w-4xl px-6 py-12">
    <header class="mb-10">
      <h1 class="font-serif text-4xl font-semibold tracking-tight">Resume Bullet Rewriter</h1>
      <p class="mt-2 text-stone-600">
        Paste a job description and your raw experience. Get 5-8 tailored bullets optimized for that role.
      </p>
    </header>

    <form id="rewrite-form" class="space-y-6">
      <div>
        <label for="job_description" class="block text-sm font-medium text-stone-800">
          Job description
        </label>
        <textarea
          id="job_description"
          name="job_description"
          rows="8"
          required
          placeholder="Paste the full job description here..."
          class="mt-2 w-full resize-y rounded-md border border-stone-300 bg-white p-3 text-sm shadow-sm focus:border-stone-900 focus:outline-none focus:ring-1 focus:ring-stone-900"
        ></textarea>
      </div>

      <div>
        <label for="experience" class="block text-sm font-medium text-stone-800">
          Your experience / existing bullets
        </label>
        <textarea
          id="experience"
          name="experience"
          rows="10"
          required
          placeholder="Paste your current bullets, a rough brain dump, or a LinkedIn copy-paste. Include numbers, tools, and scale where you remember them."
          class="mt-2 w-full resize-y rounded-md border border-stone-300 bg-white p-3 text-sm shadow-sm focus:border-stone-900 focus:outline-none focus:ring-1 focus:ring-stone-900"
        ></textarea>
      </div>

      <button
        type="submit"
        id="submit-btn"
        class="inline-flex items-center rounded-md bg-stone-900 px-5 py-2.5 text-sm font-medium text-white shadow-sm hover:bg-stone-700 disabled:cursor-not-allowed disabled:bg-stone-400"
      >
        Rewrite my bullets
      </button>
    </form>

    <section id="output" class="mt-12 hidden">
      <h2 class="font-serif text-2xl font-semibold">Tailored bullets</h2>
      <ul id="bullets" class="mt-4 space-y-3"></ul>

      <div id="meta" class="mt-8 border-t border-stone-200 pt-6 text-sm text-stone-600"></div>
    </section>

    <section id="error" class="mt-8 hidden rounded-md border border-red-300 bg-red-50 p-4 text-sm text-red-800"></section>
  </main>

  <script>
    const form = document.getElementById("rewrite-form");
    const btn = document.getElementById("submit-btn");
    const output = document.getElementById("output");
    const bulletsEl = document.getElementById("bullets");
    const metaEl = document.getElementById("meta");
    const errorEl = document.getElementById("error");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.classList.add("hidden");
      output.classList.add("hidden");
      btn.disabled = true;
      btn.textContent = "Thinking...";

      const payload = {
        job_description: document.getElementById("job_description").value,
        experience: document.getElementById("experience").value,
      };

      try {
        const res = await fetch("/api/rewrite", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const data = await res.json();

        if (!res.ok) {
          errorEl.textContent = data.error || "Something went wrong.";
          errorEl.classList.remove("hidden");
          return;
        }

        bulletsEl.innerHTML = "";
        for (const bullet of data.bullets || []) {
          const li = document.createElement("li");
          li.className = "flex gap-3 rounded-md border border-stone-200 bg-white p-3 text-sm shadow-sm";
          li.innerHTML = `
            <span class="mt-0.5 select-none text-stone-400">•</span>
            <span class="flex-1 leading-relaxed">${escapeHtml(bullet)}</span>
            <button class="copy-btn shrink-0 rounded border border-stone-300 px-2 py-1 text-xs text-stone-600 hover:bg-stone-100" aria-label="Copy">copy</button>
          `;
          li.querySelector(".copy-btn").addEventListener("click", () => {
            navigator.clipboard.writeText(bullet);
          });
          bulletsEl.appendChild(li);
        }

        const kw = (data.keywords_matched || []).join(", ");
        metaEl.innerHTML = `
          ${kw ? `<p><strong class="text-stone-800">Keywords matched:</strong> ${escapeHtml(kw)}</p>` : ""}
          ${data.notes ? `<p class="mt-2"><strong class="text-stone-800">Notes:</strong> ${escapeHtml(data.notes)}</p>` : ""}
        `;
        output.classList.remove("hidden");
      } catch (err) {
        errorEl.textContent = "Network error. Try again.";
        errorEl.classList.remove("hidden");
      } finally {
        btn.disabled = false;
        btn.textContent = "Rewrite my bullets";
      }
    });

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
