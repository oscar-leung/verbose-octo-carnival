<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SOQ Generator — CalCareers</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-50 text-stone-900 antialiased">
  <main class="mx-auto max-w-4xl px-6 py-12">
    <header class="mb-10">
      <h1 class="font-serif text-4xl font-semibold tracking-tight">SOQ Generator</h1>
      <p class="mt-2 text-stone-600">
        Paste the CalCareers SOQ prompts, the duty statement, and your experience. Get STAR/CAR-structured
        responses that mirror the posting's language.
      </p>
    </header>

    <form id="soq-form" class="space-y-6">
      <div>
        <label for="prompts" class="block text-sm font-medium text-stone-800">SOQ prompts</label>
        <textarea
          id="prompts"
          name="prompts"
          rows="5"
          required
          placeholder="Paste the SOQ prompts verbatim, one per paragraph. e.g. 1. Describe your experience leading a process improvement initiative..."
          class="mt-2 w-full resize-y rounded-md border border-stone-300 bg-white p-3 text-sm shadow-sm focus:border-stone-900 focus:outline-none focus:ring-1 focus:ring-stone-900"
        ></textarea>
      </div>

      <div>
        <label for="duty_statement" class="block text-sm font-medium text-stone-800">
          Duty statement + MQs / DQs <span class="font-normal text-stone-500">(optional, strongly recommended)</span>
        </label>
        <textarea
          id="duty_statement"
          name="duty_statement"
          rows="6"
          placeholder="Paste the Duty Statement and Minimum / Desirable Qualifications sections from the job posting. The model will mirror their exact phrasing."
          class="mt-2 w-full resize-y rounded-md border border-stone-300 bg-white p-3 text-sm shadow-sm focus:border-stone-900 focus:outline-none focus:ring-1 focus:ring-stone-900"
        ></textarea>
      </div>

      <div>
        <label for="experience" class="block text-sm font-medium text-stone-800">Your experience</label>
        <textarea
          id="experience"
          name="experience"
          rows="10"
          required
          placeholder="Paste your resume, project list, or a brain dump. Include civil service classifications you've held, systems you've used (FI$Cal, CalHR, etc.), numbers where you remember them."
          class="mt-2 w-full resize-y rounded-md border border-stone-300 bg-white p-3 text-sm shadow-sm focus:border-stone-900 focus:outline-none focus:ring-1 focus:ring-stone-900"
        ></textarea>
      </div>

      <button
        type="submit"
        id="submit-btn"
        class="inline-flex items-center rounded-md bg-stone-900 px-5 py-2.5 text-sm font-medium text-white shadow-sm hover:bg-stone-700 disabled:cursor-not-allowed disabled:bg-stone-400"
      >
        Generate SOQ responses
      </button>
    </form>

    <section id="output" class="mt-12 hidden space-y-8">
      <div id="responses" class="space-y-8"></div>

      <div id="meta" class="border-t border-stone-200 pt-6 text-sm text-stone-600"></div>
    </section>

    <section id="error" class="mt-8 hidden rounded-md border border-red-300 bg-red-50 p-4 text-sm text-red-800"></section>
  </main>

  <script>
    const form = document.getElementById("soq-form");
    const btn = document.getElementById("submit-btn");
    const output = document.getElementById("output");
    const responsesEl = document.getElementById("responses");
    const metaEl = document.getElementById("meta");
    const errorEl = document.getElementById("error");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.classList.add("hidden");
      output.classList.add("hidden");
      btn.disabled = true;
      btn.textContent = "Drafting...";

      const payload = {
        prompts: document.getElementById("prompts").value,
        duty_statement: document.getElementById("duty_statement").value,
        experience: document.getElementById("experience").value,
      };

      try {
        const res = await fetch("/api/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const data = await res.json();

        if (!res.ok) {
          errorEl.textContent = data.error || "Something went wrong.";
          errorEl.classList.remove("hidden");
          return;
        }

        responsesEl.innerHTML = "";
        (data.responses || []).forEach((r, i) => {
          const section = document.createElement("section");
          section.className = "rounded-md border border-stone-200 bg-white p-5 shadow-sm";
          const keywords = (r.keywords_matched || []).join(", ");
          section.innerHTML = `
            <div class="flex items-start justify-between gap-4">
              <h3 class="font-serif text-lg font-semibold">Response ${i + 1} <span class="ml-2 rounded bg-stone-100 px-2 py-0.5 text-xs font-medium text-stone-600">${escapeHtml(r.structure || "STAR")}</span></h3>
              <button class="copy-btn shrink-0 rounded border border-stone-300 px-2 py-1 text-xs text-stone-600 hover:bg-stone-100">copy</button>
            </div>
            <p class="mt-2 text-xs italic text-stone-500">Prompt: ${escapeHtml(r.prompt || "")}</p>
            <pre class="mt-3 whitespace-pre-wrap font-sans text-sm leading-relaxed">${escapeHtml(r.response || "")}</pre>
            ${keywords ? `<p class="mt-3 text-xs text-stone-500"><strong class="text-stone-700">Keywords matched:</strong> ${escapeHtml(keywords)}</p>` : ""}
          `;
          section.querySelector(".copy-btn").addEventListener("click", () => {
            navigator.clipboard.writeText(r.response || "");
          });
          responsesEl.appendChild(section);
        });

        metaEl.innerHTML = data.notes
          ? `<p><strong class="text-stone-800">Reviewer notes:</strong> ${escapeHtml(data.notes)}</p>`
          : "";
        output.classList.remove("hidden");
      } catch (err) {
        errorEl.textContent = "Network error. Try again.";
        errorEl.classList.remove("hidden");
      } finally {
        btn.disabled = false;
        btn.textContent = "Generate SOQ responses";
      }
    });

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
