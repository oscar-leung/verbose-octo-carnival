<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cold Email Personalizer</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-50 text-stone-900 antialiased">
  <main class="mx-auto max-w-4xl px-6 py-12">
    <header class="mb-10">
      <h1 class="font-serif text-4xl font-semibold tracking-tight">Cold Email Personalizer</h1>
      <p class="mt-2 text-stone-600">
        Paste a LinkedIn bio or recipient profile + your pitch. Get a personalized email + 3 subject lines.
      </p>
    </header>

    <form id="personalize-form" class="space-y-6">
      <div class="grid gap-6 md:grid-cols-2">
        <div>
          <label for="sender_name" class="block text-sm font-medium text-stone-800">Your first name</label>
          <input
            type="text"
            id="sender_name"
            name="sender_name"
            required
            placeholder="Oscar"
            class="mt-2 w-full rounded-md border border-stone-300 bg-white p-3 text-sm shadow-sm focus:border-stone-900 focus:outline-none focus:ring-1 focus:ring-stone-900"
          />
        </div>
      </div>

      <div>
        <label for="recipient" class="block text-sm font-medium text-stone-800">Recipient profile</label>
        <textarea
          id="recipient"
          name="recipient"
          rows="8"
          required
          placeholder="Name, title, company. Paste their LinkedIn bio, recent posts, a company blurb, anything that might be a hook."
          class="mt-2 w-full resize-y rounded-md border border-stone-300 bg-white p-3 text-sm shadow-sm focus:border-stone-900 focus:outline-none focus:ring-1 focus:ring-stone-900"
        ></textarea>
      </div>

      <div>
        <label for="pitch" class="block text-sm font-medium text-stone-800">Your pitch</label>
        <textarea
          id="pitch"
          name="pitch"
          rows="6"
          required
          placeholder="What are you offering? Who do you help? What's the ask (15-min call, reply with yes/no, link)? Keep it short — the model compresses this into one sentence."
          class="mt-2 w-full resize-y rounded-md border border-stone-300 bg-white p-3 text-sm shadow-sm focus:border-stone-900 focus:outline-none focus:ring-1 focus:ring-stone-900"
        ></textarea>
      </div>

      <button
        type="submit"
        id="submit-btn"
        class="inline-flex items-center rounded-md bg-stone-900 px-5 py-2.5 text-sm font-medium text-white shadow-sm hover:bg-stone-700 disabled:cursor-not-allowed disabled:bg-stone-400"
      >
        Write the email
      </button>
    </form>

    <section id="output" class="mt-12 hidden space-y-8">
      <div>
        <h2 class="font-serif text-2xl font-semibold">Subject lines</h2>
        <ul id="subjects" class="mt-4 space-y-2"></ul>
      </div>

      <div>
        <div class="flex items-center justify-between">
          <h2 class="font-serif text-2xl font-semibold">Email</h2>
          <button
            id="copy-email"
            class="rounded-md border border-stone-300 bg-white px-3 py-1.5 text-xs text-stone-700 hover:bg-stone-100"
          >
            copy email body
          </button>
        </div>
        <pre
          id="email-body"
          class="mt-4 whitespace-pre-wrap rounded-md border border-stone-200 bg-white p-4 font-sans text-sm leading-relaxed shadow-sm"
        ></pre>
      </div>

      <div id="meta" class="border-t border-stone-200 pt-6 text-sm text-stone-600"></div>
    </section>

    <section id="error" class="mt-8 hidden rounded-md border border-red-300 bg-red-50 p-4 text-sm text-red-800"></section>
  </main>

  <script>
    const form = document.getElementById("personalize-form");
    const btn = document.getElementById("submit-btn");
    const output = document.getElementById("output");
    const subjectsEl = document.getElementById("subjects");
    const emailEl = document.getElementById("email-body");
    const metaEl = document.getElementById("meta");
    const errorEl = document.getElementById("error");
    const copyBtn = document.getElementById("copy-email");

    copyBtn.addEventListener("click", () => {
      navigator.clipboard.writeText(emailEl.textContent);
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.classList.add("hidden");
      output.classList.add("hidden");
      btn.disabled = true;
      btn.textContent = "Writing...";

      const payload = {
        sender_name: document.getElementById("sender_name").value,
        recipient: document.getElementById("recipient").value,
        pitch: document.getElementById("pitch").value,
      };

      try {
        const res = await fetch("/api/personalize", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const data = await res.json();

        if (!res.ok) {
          errorEl.textContent = data.error || "Something went wrong.";
          errorEl.classList.remove("hidden");
          return;
        }

        subjectsEl.innerHTML = "";
        for (const subject of data.subject_lines || []) {
          const li = document.createElement("li");
          li.className =
            "flex items-center gap-3 rounded-md border border-stone-200 bg-white p-3 text-sm shadow-sm";
          li.innerHTML = `
            <span class="flex-1">${escapeHtml(subject)}</span>
            <button class="copy-btn shrink-0 rounded border border-stone-300 px-2 py-1 text-xs text-stone-600 hover:bg-stone-100">copy</button>
          `;
          li.querySelector(".copy-btn").addEventListener("click", () => {
            navigator.clipboard.writeText(subject);
          });
          subjectsEl.appendChild(li);
        }

        emailEl.textContent = data.email_body || "";

        metaEl.innerHTML = `
          ${data.personalization_hook ? `<p><strong class="text-stone-800">Hook used:</strong> ${escapeHtml(data.personalization_hook)}</p>` : ""}
          ${data.notes ? `<p class="mt-2"><strong class="text-stone-800">Notes:</strong> ${escapeHtml(data.notes)}</p>` : ""}
        `;
        output.classList.remove("hidden");
      } catch (err) {
        errorEl.textContent = "Network error. Try again.";
        errorEl.classList.remove("hidden");
      } finally {
        btn.disabled = false;
        btn.textContent = "Write the email";
      }
    });

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
